# Realme C63 - Main Configuration File
# Generated: 2026-01-10
# Version: 1.0.0

[Installation]
VERSION=1.0.0
INSTALL_DATE=2026-01-10
INSTALL_PATH=${INSTALL_DIR}

[Device]
DEVICE_MODEL=Realme C63
DEVICE_CODENAME=RMX3939
DEVICE_ARCH=arm64
ANDROID_VERSION=12
REALME_UI_VERSION=3.0

[System]
OS_TYPE=${OS_TYPE}
OS_VERSION=${OS_VERSION}
ARCHITECTURE=${ARCH}
PACKAGE_MANAGER=${PACKAGE_MANAGER}

[Directories]
CONFIG_DIR=${CONFIG_DIR}
CACHE_DIR=${CACHE_DIR}
BACKUP_DIR=${BACKUP_DIR}
LOG_DIR=${INSTALL_DIR}/logs
BIN_DIR=${INSTALL_DIR}/bin
LIB_DIR=${INSTALL_DIR}/lib
TEMP_DIR=${INSTALL_DIR}/temp

[Features]
ENABLE_LOGGING=true
ENABLE_NOTIFICATIONS=true
ENABLE_AUTO_UPDATE=true
ENABLE_BACKUP=true
ENABLE_VERIFICATION=true

[Logging]
LOG_LEVEL=INFO
LOG_FILE=${LOG_FILE}
MAX_LOG_SIZE=10485760
LOG_RETENTION_DAYS=30
ENABLE_CONSOLE_OUTPUT=true

[Security]
ENABLE_SSL_VERIFICATION=true
ENABLE_SIGNATURE_VERIFICATION=true
BACKUP_CONFIG_CHANGES=true
VERIFY_DOWNLOADS=true
CHECK_DEVICE_COMPATIBILITY=true

[Performance]
PARALLEL_OPERATIONS=true
CACHE_DOWNLOADS=true
COMPRESSION_ENABLED=true
MAX_PARALLEL_JOBS=4
DOWNLOAD_TIMEOUT=300

[Update]
CHECK_FOR_UPDATES=true
AUTO_UPDATE=false
UPDATE_CHECK_INTERVAL=604800
UPDATE_URL=https://github.com/Xylop90/Realme-C63

[ROM]
ROM_NAME=Xtreme XA-vI
ROM_VERSION=1.0
ROM_TYPE=Custom
BASE_ANDROID_VERSION=12

[Installation_Options]
UNLOCK_BOOTLOADER=true
INSTALL_TWRP=true
INSTALL_MAGISK=false
INSTALL_GAPPS=false
WIPE_DATA=true
FORMAT_DATA=true

[Timeouts]
BOOTLOADER_TIMEOUT=300
ROM_FLASH_TIMEOUT=900
SYSTEM_BOOT_TIMEOUT=600
ADB_TIMEOUT=30
FASTBOOT_TIMEOUT=60

[Thresholds]
CPU_LOAD_THRESHOLD=80
MEMORY_THRESHOLD=85
DISK_THRESHOLD=90
BATTERY_THRESHOLD=20
