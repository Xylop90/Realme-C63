# Environment Variables Configuration
# Generated: 2026-01-10
# Realme C63 Installation Environment

# ==============================================================================
# Installation Paths
# ==============================================================================
export REALME_C63_HOME="${INSTALL_DIR:-.}"
export REALME_C63_CONFIG="${CONFIG_DIR:-./config}"
export REALME_C63_BIN="${INSTALL_DIR:-.}/bin"
export REALME_C63_LIB="${INSTALL_DIR:-.}/lib"
export REALME_C63_LOGS="${INSTALL_DIR:-.}/logs"
export REALME_C63_CACHE="${CACHE_DIR:-./.cache}"
export REALME_C63_BACKUP="${BACKUP_DIR:-./backups}"
export REALME_C63_TEMP="${TEMP_DIR:-./temp}"

# ==============================================================================
# Version Information
# ==============================================================================
export REALME_C63_VERSION="1.0.0"
export REALME_C63_ROM_VERSION="1.0"
export REALME_C63_INSTALL_DATE="2026-01-10"

# ==============================================================================
# Device Information
# ==============================================================================
export REALME_C63_DEVICE="Realme C63"
export REALME_C63_CODENAME="RMX3939"
export REALME_C63_ARCH="arm64"
export REALME_C63_ANDROID="12"
export REALME_C63_REALME_UI="3.0"

# ==============================================================================
# System Information
# ==============================================================================
export REALME_C63_OS="${OS_TYPE:-Linux}"
export REALME_C63_ARCH="${ARCH:-arm64}"

# ==============================================================================
# Logging
# ==============================================================================
export REALME_C63_LOG_FILE="${LOG_FILE:-./logs/install.log}"
export REALME_C63_LOG_LEVEL="INFO"
export REALME_C63_LOG_FORMAT="[%Y-%m-%d %H:%M:%S]"

# ==============================================================================
# Features
# ==============================================================================
export REALME_C63_ENABLE_NOTIFICATIONS=true
export REALME_C63_ENABLE_AUTO_UPDATE=true
export REALME_C63_ENABLE_BACKUP=true
export REALME_C63_ENABLE_VERIFICATION=true

# ==============================================================================
# Tools Configuration
# ==============================================================================
export REALME_C63_ADB_PATH="${REALME_C63_BIN}/adb"
export REALME_C63_FASTBOOT_PATH="${REALME_C63_BIN}/fastboot"
export REALME_C63_PYTHON="${PYTHON:-python3}"

# ==============================================================================
# ROM Configuration
# ==============================================================================
export REALME_C63_ROM_NAME="Xtreme XA-vI"
export REALME_C63_ROM_TYPE="Custom"
export REALME_C63_ROM_BASE="Android 12"

# ==============================================================================
# URLs & Resources
# ==============================================================================
export REALME_C63_REPO_URL="https://github.com/Xylop90/Realme-C63"
export REALME_C63_DOCS_URL="https://github.com/Xylop90/Realme-C63/tree/main/docs"
export REALME_C63_ISSUES_URL="https://github.com/Xylop90/Realme-C63/issues"

# ==============================================================================
# PATH Extension
# ==============================================================================
export PATH="${REALME_C63_BIN}:${PATH}"

# ==============================================================================
# Aliases (Optional)
# ==============================================================================
alias realme-config='cat ${REALME_C63_CONFIG}/realme-c63.conf'
alias realme-logs='tail -f ${REALME_C63_LOG_FILE}'
alias realme-version='echo "Realme C63 Tools v${REALME_C63_VERSION}"'

# ==============================================================================
# Color Codes for Scripts
# ==============================================================================
export COLOR_RED='\033[0;31m'
export COLOR_GREEN='\033[0;32m'
export COLOR_YELLOW='\033[1;33m'
export COLOR_BLUE='\033[0;34m'
export COLOR_MAGENTA='\033[0;35m'
export COLOR_CYAN='\033[0;36m'
export COLOR_NC='\033[0m'

# ==============================================================================
# Development Mode (Set to true for verbose output)
# ==============================================================================
export REALME_C63_DEBUG="${DEBUG:-false}"
export REALME_C63_VERBOSE="${VERBOSE:-false}"
